name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Fork
      uses: actions/checkout@v3
      with:
        ref: main # Replace with your default branch if it's not 'main'

    - name: Add Upstream Remote
      run: git remote add upstream https://github.com/matchi-1/CStarCompiler.git

    - name: Set up Authentication
      run: git config --global credential.helper store
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Fetch Upstream Changes
      run: git fetch upstream
      env:
        GIT_ASKPASS: /dev/null
        GIT_USERNAME: ${{ github.actor }}  # Uses the GitHub actor for your username
        GIT_PASSWORD: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Uses your PAT as password

    - name: Merge Upstream into Fork
      run: |
        git checkout main
        git merge upstream/main # Replace 'main' with the default branch of the upstream repo
      env:
        GIT_USERNAME: ${{ github.actor }}  # Uses the GitHub actor for your username
        GIT_PASSWORD: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Uses your PAT as password

    - name: Push Changes to Fork
      run: git push origin main
      env:
        GIT_USERNAME: ${{ github.actor }}  # Uses the GitHub actor for your username
        GIT_PASSWORD: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Uses your PAT as password
